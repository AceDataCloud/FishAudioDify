identity:
  name: fish_audio_generate
  author: acedatacloud
  label:
    en_US: Synthesize speech
description:
  human:
    en_US: Synthesize speech through Fish Audio by Ace Data Cloud.
  llm: Synthesize speech through Fish Audio by Ace Data Cloud. Generation returns
    a task ID; use Retrieve or wait for task for the final result.
parameters:
- name: text
  label:
    en_US: Text to speak
  type: string
  required: true
  form: llm
  human_description:
    en_US: Text to speak
  llm_description: Text to speak
- name: model
  label:
    en_US: Speech model
  type: select
  required: false
  form: form
  human_description:
    en_US: Speech model
  llm_description: Speech model
  default: s2-pro
  options:
  - value: s1
    label:
      en_US: s1
  - value: s2-pro
    label:
      en_US: s2-pro
  - value: s2.1-pro
    label:
      en_US: s2.1-pro
- name: reference_id
  label:
    en_US: Reference voice ID
  type: string
  required: false
  form: llm
  human_description:
    en_US: Optional public voice ID from Search voices; omit to use the service default.
  llm_description: Optional public voice ID from Search voices; omit to use the service
    default.
- name: format
  label:
    en_US: Audio format
  type: select
  required: false
  form: form
  human_description:
    en_US: Audio format
  llm_description: Audio format
  default: mp3
  options:
  - value: mp3
    label:
      en_US: mp3
  - value: wav
    label:
      en_US: wav
output_schema:
  type: object
  properties:
    status:
      type: string
    task_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    result:
      type: object
extra:
  python:
    source: tools/generate.py
