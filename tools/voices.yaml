identity:
  name: fish_audio_voices
  author: acedatacloud
  label:
    en_US: Search voices
description:
  human:
    en_US: Search voices through Fish Audio by Ace Data Cloud.
  llm: Search voices through Fish Audio by Ace Data Cloud. Generation returns a task
    ID; use Retrieve or wait for task for the final result.
parameters:
- name: query
  label:
    en_US: Voice title search
  type: string
  required: false
  form: llm
  human_description:
    en_US: Voice title search
  llm_description: Voice title search
- name: limit
  label:
    en_US: Maximum voices
  type: number
  required: false
  form: form
  human_description:
    en_US: Maximum voices
  llm_description: Maximum voices
  default: 10
output_schema:
  type: object
  properties:
    status:
      type: string
    task_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    result:
      type: object
extra:
  python:
    source: tools/voices.py
